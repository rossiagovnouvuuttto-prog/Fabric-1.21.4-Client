name: Build Custom Minecraft 1.21.4 Fabric

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build custom runtime
        run: gradle --no-daemon clean build

      - name: Prepare FCL installer bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/Custom-Minecraft-1.21.4-Fabric"
          mkdir -p "$OUT"

          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$JAR"

          cp "$JAR" "$OUT/custom-minecraft-runtime.jar"
          cp installer/install-fcl.sh "$OUT/install-fcl.sh"
          cp installer/README-INSTALL.txt "$OUT/README-INSTALL.txt"
          chmod +x "$OUT/install-fcl.sh"

          echo "Bundle contents:"
          find "$OUT" -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Upload custom Minecraft version
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Minecraft-1.21.4-Fabric
          path: dist/Custom-Minecraft-1.21.4-Fabric/
          if-no-files-found: error
          retention-days: 30
