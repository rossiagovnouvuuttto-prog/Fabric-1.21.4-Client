name: Build Fabric 1.21.4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build
        run: gradle --no-daemon clean build

      - name: Prepare ready JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" dist/Fabric-1.21.4-Client.jar
          ls -lh dist/Fabric-1.21.4-Client.jar

      - name: Upload ready JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-1.21.4-Client
          path: dist/Fabric-1.21.4-Client.jar
          if-no-files-found: error
          retention-days: 30
